<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MutationObserver - Auto-init Bootstrap Tooltips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1 class="h4 mb-3">MutationObserver auto-init demo</h1>
    <p class="text-muted">Add, remove and toggle elements below. None of the buttons call an init function - live.js wires everything up as the DOM changes.</p>

    <p>
        <span data-bs-toggle="tooltip" data-bs-title="I was in the HTML on load" class="badge text-bg-secondary p-2">Static tooltip (hover me)</span>
    </p>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <button type="button" id="add-tooltip" class="btn btn-primary">Add tooltip element</button>
        <button type="button" id="toggle-tooltip" class="btn btn-primary">Toggle tooltip attributes</button>
        <button type="button" id="add-timer" class="btn btn-primary">Add timer element</button>
    </div>

    <div id="toggle-target" class="border rounded p-3 mb-3 d-inline-block">Existing element (no tooltip yet)</div>

    <div id="sink"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="live.js"></script>
    <script>
        const sink = document.getElementById('sink');

        // A bordered box with whatever content plus a Remove button that deletes it.
        const removableBox = (buildContent) => {
            const box = document.createElement('div');
            box.className = 'border rounded p-3 mb-3 d-inline-flex align-items-center gap-3 me-2';

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'btn btn-sm btn-outline-danger';
            remove.textContent = 'Remove';
            remove.addEventListener('click', () => box.remove());

            box.append(buildContent(), remove);

            return box;
        };

        // Insert a div carrying tooltip attributes (nested inside #sink to prove the
        // observer walks subtrees, not just top-level added nodes).
        document.getElementById('add-tooltip').addEventListener('click', () => {
            const box = removableBox(() => {
                const label = document.createElement('span');
                label.textContent = 'Hover me';
                return label;
            });

            box.setAttribute('data-bs-toggle', 'tooltip');
            box.setAttribute('data-bs-title', 'Tooltip added at ' + new Date().toLocaleTimeString());
            sink.append(box);
        });

        // Insert a ticking [data-timer] element. Removing it clears its interval.
        document.getElementById('add-timer').addEventListener('click', () => {
            sink.append(removableBox(() => {
                const label = document.createElement('span');
                label.dataset.timer = Date.now();
                return label;
            }));
        });

        // Toggle tooltip attributes on an element that's already in the page,
        // exercising the observer's attribute path (no node added or removed).
        document.getElementById('toggle-tooltip').addEventListener('click', () => {
            const el = document.getElementById('toggle-target');

            if (el.getAttribute('data-bs-toggle') === 'tooltip') {
                el.removeAttribute('data-bs-toggle');
                el.textContent = 'Existing element (no tooltip yet)';
            } else {
                el.setAttribute('data-bs-title', 'Tooltip toggled on at ' + new Date().toLocaleTimeString());
                el.setAttribute('data-bs-toggle', 'tooltip');
                el.textContent = 'Hover me (tooltip toggled on)';
            }
        });
    </script>
</body>
</html>
